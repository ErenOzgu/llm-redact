name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.28.0"

jobs:
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.21", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false # no third-party dependencies, so no go.sum to cache on
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test ./... -race -count=1

  fuzz:
    name: Fuzzing (60 s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Round trip on arbitrary input
        run: go test ./internal/redact -run '^$' -fuzz FuzzRoundTrip -fuzztime 60s

  # An unrelated secret scanner has to find secrets in a corpus of fake credentials, find none after
  # llm-redact, and restoring has to give the original files back. See hack/leakcheck.sh.
  leakcheck:
    name: Independent leak check (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }} (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tgz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | sed 's/ gitleaks_.*/ gitleaks.tgz/' | sha256sum -c -
          mkdir -p "$HOME/bin" && tar -xzf gitleaks.tgz -C "$HOME/bin" gitleaks
      - name: Leak check
        run: hack/leakcheck.sh "$HOME/bin/gitleaks"

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x hack/leakcheck.sh
